name: Windows release

# 手动触发：构建非官方 Windows x64 安装包并创建草稿 Release。
# 从主分支的当前提交构建，产物与发布说明都记录构建 SHA。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'bianzuilun/dsh-our-free-model'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare frontend and build tools
        shell: pwsh
        run: |
          npm ci --prefix packages/standalone --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-standalone-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix packages/desktop --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Windows x64 installer
        env:
          CI: true
        run: npm --prefix packages/desktop run build -- --bundles nsis
      - name: Prepare draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath packages/desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one complete NSIS installer' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $asset = 'Our-Free-Model_2.5.7-lockfix.2_windows-x64-setup.exe'
          Copy-Item -LiteralPath $installers[0].FullName -Destination (Join-Path dist $asset)
          $digest = (Get-FileHash -LiteralPath (Join-Path dist $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $asset" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8NoBOM
          $notes = @"
          这是 bianzuilun fork 的非官方 Windows x64 社区构建。独立服务版本 2.5.7，修复标识 lockfix.2。

          修复异常退出后残留 service.lock 导致服务无法启动：macOS 现在与 Windows、Linux 一样，会在确认锁记录的服务进程已退出（ESRCH）后回收陈旧锁并重建；无法确认归属、进程仍存活或权限不足时保留锁。

          安装包内含 Node.js v24.18.0 x64、服务资源和完整许可证。安装前请从系统托盘退出旧版程序，已有账号和配置保留。

          构建提交为本次 main 的提交；仓库 test 工作流已通过，安装包未进行 Windows 代码签名，未做安装后的启动验证。

          构建提交：$env:GITHUB_SHA
          安装包 SHA-256：$digest
          "@
          $notes | Set-Content -LiteralPath dist/RELEASE-NOTES.md -Encoding utf8NoBOM
          gh release create ofm-windows-2.5.7-lockfix.2 (Join-Path dist $asset) dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title 'Our Free Model 2.5.7 Windows x64 锁修复版（非官方）' --notes-file dist/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Installer SHA256: $digest" >> $env:GITHUB_STEP_SUMMARY
